@let ready = isReady();

<app-titlebar></app-titlebar>

<section>
    <app-sidebar></app-sidebar>

    @if(ready) {
        <main class="main">
            <app-tabs-bar></app-tabs-bar>
            <router-outlet/>
        </main>
    }
</section>

<app-statusbar></app-statusbar>

@if(!ready) {
    <app-loading-screen [showContent]="!isReloading"></app-loading-screen>
}

<app-theme-picker></app-theme-picker>
<app-recent-databases></app-recent-databases>
