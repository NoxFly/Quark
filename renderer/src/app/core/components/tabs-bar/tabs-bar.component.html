@if (tabs().length > 0) {
    <div class="tabs-bar" role="tablist" (wheel)="onWheel($event)">
        @for (tab of tabs(); track tab.tableName; let i = $index) {
            <div
                class="tab"
                role="tab"
                draggable="true"
                [class.active]="i === activeIndex()"
                [class.drag-over]="i === dragOverIndex()"
                [class.dragging]="i === dragIndex()"
                (click)="switchTab(i, tab)"
                (contextmenu)="onTabContextMenu($event, i)"
                (dragstart)="onDragStart($event, i)"
                (dragover)="onDragOver($event, i)"
                (dragleave)="onDragLeave()"
                (drop)="onDrop($event, i)"
                (dragend)="onDragEnd()"
                [class.sql-editor-tab]="specialTab(tab) !== null"
                [tooltip]="tabLabel(tab)">
                @if (specialTab(tab); as special) {
                    <span class="tab-icon segoe-icon">{{ special.icon }}</span>
                }

                <span class="tab-label">{{ tabLabel(tab) }}</span>
                <button
                    class="tab-close"
                    (click)="closeTab($event, i)"
                    [tooltip]="i18n.t('tabs.close')">
                    ✕
                </button>
            </div>
        }
    </div>
    <app-context-menu></app-context-menu>
}
