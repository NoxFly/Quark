@if (state.connected()) {
    <div class="sidebar-header">
        <div class="header-actions">
            <ui-button class="header-btn refresh-btn" icon="e72c" (click)="refreshDatabase()" [title]="i18n.t('sidebar.refresh.tooltip')">
                {{ i18n.t("sidebar.refresh") }}
            </ui-button>
            <ui-button class="header-btn close-btn" icon="e8bb" (click)="closeFile()" [title]="i18n.t('sidebar.close.tooltip')">
                {{ i18n.t("sidebar.close") }}
            </ui-button>
        </div>
    </div>

    <nav class="tables-list">
        <ul>
            @for (table of tables(); track table.name) {
                <li
                    [class.active]="selectedTable() === table.name"
                    (click)="selectTable(table.name)"
                    [title]="table.name + ' (' + i18n.t('sidebar.rows', { count: table.recordCount }) + ')'"
                >
                    <span class="table-icon">&#xE80F;</span>
                    <span class="table-name">{{ table.name }}</span>
                    <span class="table-count">{{ table.recordCount }}</span>
                </li>
            }
        </ul>
    </nav>

    <div
        class="resize-handle"
        (mousedown)="startResize($event)"
    ></div>
}
