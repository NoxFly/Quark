@if (state.connected()) {
    <div class="statusbar">
        <div class="left">
            @if (tableName()) {
                <span class="table-name">{{ tableName() }}</span>
            }
            @if (recordInfo()) {
                <span class="record-count">{{ recordInfo() }}</span>
            }
            @if (selectionInfo()) {
                <span class="selection-info">{{ selectionInfo() }}</span>
            }
        </div>
        <div class="right">
            @if (transactionInfo()) {
                <span class="transaction-badge">{{ transactionInfo() }}</span>
            }
            <button
                class="edit-mode-btn"
                [class.active]="!readOnly()"
                (click)="toggleReadOnly()"
                [title]="readOnly() ? i18n.t('table.switchToEdit') : i18n.t('table.switchToReadOnly')"
            >
                <span class="segoe-icon">{{ readOnly() ? '&#xE736;' : '&#xE70F;' }}</span>
                <span class="edit-mode-label">{{ editModeLabel() }}</span>
            </button>
        </div>
    </div>
}
