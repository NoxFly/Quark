<div class="open-database" [class.dragging]="isDragging()">
    @if (state.needsPassword()) {
        <div class="password-prompt">
            <div class="icon">&#xE72E;</div>
            <h2>{{ "openDb.encrypted" | translate }}</h2>
            <p>{{ "openDb.enterPassword" | translate }}</p>

            <div class="password-field">
                <input
                    type="password"
                    [placeholder]="'openDb.password' | translate"
                    [ngModel]="password()"
                    (ngModelChange)="password.set($event)"
                    (keydown)="onPasswordKeydown($event)"
                    [class.error]="passwordError()"
                    autofocus
                />
                <button (click)="submitPassword()" [disabled]="submitting() || !password()">
                    {{ "openDb.unlock" | translate }}
                </button>
            </div>

            @if (passwordError()) {
                <p class="error-message">{{ "openDb.wrongPassword" | translate }}</p>
            }
        </div>
    } @else {
        <div class="drop-zone" (click)="openFileExplorer()">
            <div class="drop-icon">&#xE8E5;</div>
            <h2>{{ "openDb.title" | translate }}</h2>
            <p>{{ "openDb.dropHint" | translate }}</p>
            <p class="shortcut">Ctrl+O</p>
        </div>
    }
</div>
