<div class="open-database" [class.dragging]="isDragging()">
    @if (state.needsPassword()) {
        <div class="password-prompt">
            <div class="icon">&#xE72E;</div>
            <h2>Base de données chiffrée</h2>
            <p>Entrez le mot de passe pour déverrouiller la base de données.</p>

            <div class="password-field">
                <input
                    type="password"
                    placeholder="Mot de passe"
                    [ngModel]="password()"
                    (ngModelChange)="password.set($event)"
                    (keydown)="onPasswordKeydown($event)"
                    [class.error]="passwordError()"
                    autofocus
                />
                <button (click)="submitPassword()" [disabled]="submitting() || !password()">
                    Déverrouiller
                </button>
            </div>

            @if (passwordError()) {
                <p class="error-message">Mot de passe incorrect ou base corrompue.</p>
            }
        </div>
    } @else {
        <div class="drop-zone" (click)="openFileExplorer()">
            <div class="drop-icon">&#xE8E5;</div>
            <h2>Ouvrir une base de données SQLite</h2>
            <p>Cliquez ici ou glissez-déposez un fichier</p>
            <p class="shortcut">Ctrl+O</p>
        </div>
    }
</div>
