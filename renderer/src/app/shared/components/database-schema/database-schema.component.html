<div class="database-schema">
    <div class="modal-header">
        <h2>{{ i18n.t('schemaViewer.title') }}</h2>
    </div>

    <div class="modal-body">
        @for (entry of schemaSqls(); track entry.name) {
            <div class="table-block">
                <div class="table-block-header">
                    <span class="table-block-name">{{ entry.name }}</span>
                </div>
                <pre class="table-block-sql">{{ entry.sql }}</pre>
            </div>
        }
    </div>

    <div class="modal-actions">
        <ui-button color="secondary" (click)="close()">{{ i18n.t('schemaViewer.close') }}</ui-button>
        <ui-button color="secondary" icon="e8c8" (click)="copyAll()">
            {{ copied() ? i18n.t('schemaViewer.copied') : i18n.t('schemaViewer.copyAll') }}
        </ui-button>
        <ui-button color="primary" icon="e74e" (click)="exportSql()">{{ i18n.t('schemaViewer.export') }}</ui-button>
    </div>
</div>
