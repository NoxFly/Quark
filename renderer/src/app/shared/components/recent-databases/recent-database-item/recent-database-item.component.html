<div class="thumb-wrap">
    <div class="thumb">
        @if (logo(); as src) {
            <img [src]="src" [alt]="entry().displayName" />
        }
        @else {
            {{ monogram() }}
        }
    </div>

    @switch (badge()) {
        @case ("share") {
            <span class="badge" [title]="'recent.badge.share' | translate">
                <svg width="9" height="9" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M9.5 2H14v4.5M14 2 7.5 8.5M12 9.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3.5"
                        fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </span>
        }
        @case ("lock") {
            <span class="badge" [title]="'recent.badge.password' | translate">
                <svg width="9" height="9" viewBox="0 0 16 16" aria-hidden="true">
                    <rect x="3" y="7" width="10" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8" />
                    <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.8" />
                </svg>
            </span>
        }
    }
</div>
<div class="texts">
    <div class="name" [title]="entry().displayName">{{ entry().displayName }}</div>
    <div class="sub" [title]="subtitle()">{{ subtitle() }}</div>
</div>
