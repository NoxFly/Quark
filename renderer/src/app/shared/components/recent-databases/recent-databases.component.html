@if (isOpen()) {
    <div class="recent-overlay" (click)="close()">
        <div class="recent-sheet" (click)="$event.stopPropagation()">
            <div class="recent-header">{{ i18n.t('recentDb.title') }}</div>
            <div class="recent-list">
                @if (entries().length === 0) {
                    <div class="recent-empty">{{ i18n.t('recentDb.empty') }}</div>
                }
                @for (entry of entries(); track entry.lastOpened; let i = $index) {
                    <button
                        class="recent-option"
                        [class.selected]="selectedIndex() === i"
                        (click)="selectEntry($event, i)">
                        <span class="recent-filename">{{ entry.displayName }}</span>
                        <span class="recent-directory">{{ entry.displaySubtitle }}</span>
                    </button>
                }
            </div>
        </div>
    </div>
}
