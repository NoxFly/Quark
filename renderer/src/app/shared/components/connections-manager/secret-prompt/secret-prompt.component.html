<div class="backdrop" (click)="cancelled.emit()"></div>

<div class="dialog" role="dialog" aria-modal="true" (keydown.escape)="$event.stopPropagation(); cancelled.emit()">
    <div class="head">
        <div class="cm-title">{{ title() }}</div>
        <button type="button" class="close" [attr.aria-label]="'editor.cancel' | translate" (click)="cancelled.emit()">✕</button>
    </div>

    <div class="body">
        @if (hint()) {
            <div class="cm-hint">{{ hint() }}</div>
        }

        <div class="cm-field">
            <label for="cm-secret">{{ label() }}</label>
            <input
                #secretInput
                id="cm-secret"
                class="cm-input"
                type="password"
                [autocomplete]="isNewSecret() ? 'new-password' : 'current-password'"
                [(ngModel)]="secret"
                (keydown.enter)="submit()" />
        </div>

        @if (confirmLabel(); as confirm) {
            <div class="cm-field">
                <label for="cm-secret-confirm">{{ confirm }}</label>
                <input
                    id="cm-secret-confirm"
                    class="cm-input"
                    type="password"
                    autocomplete="new-password"
                    [(ngModel)]="confirmation"
                    (keydown.enter)="submit()" />
            </div>
        }

        @if (error(); as message) {
            <div class="cm-error">{{ message }}</div>
        }
    </div>

    <div class="actions">
        <button type="button" class="cm-btn" (click)="cancelled.emit()">{{ 'editor.cancel' | translate }}</button>
        <button type="button" class="cm-btn primary" [disabled]="!canSubmit()" (click)="submit()">{{ submitLabel() }}</button>
    </div>
</div>
