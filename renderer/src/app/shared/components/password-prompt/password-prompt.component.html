@if (isOpen()) {
    <div class="prompt-overlay" (click)="close()">
        <div class="prompt-sheet" (click)="stopPropagation($event)">
            <div class="prompt-header">{{ i18n.t('passwordPrompt.title') }}</div>
            <div class="prompt-body">
                <input
                    type="password"
                    class="prompt-input"
                    [class.error]="hasError()"
                    [placeholder]="i18n.t('passwordPrompt.placeholder')"
                    [value]="password()"
                    (input)="onPasswordInput($event)"
                    (keydown)="onInputKeydown($event)"
                    autofocus
                    autocomplete="current-password"
                />
            </div>
        </div>
    </div>
}
