@if(isImage() || isSVG()) {
    @if(isSVG()) {
        <span class="icon icon-svg" [innerHTML]="content() | bypass: 'html'"></span>
    }

    @if(isImage()) {
        <span class="icon icon-image" [style.--icon-url]="'url(' + src() + ')'"></span>
    }
}
@else {
    <span class="unicode-icon" [innerHTML]="getUnicode(src()) | bypass:'html'"></span>
}
