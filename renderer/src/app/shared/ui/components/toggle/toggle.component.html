<input
    type="checkbox"
    [id]="id"
    [disabled]="isDisabled() !== false"
    [checked]="checked()"
    (input)="handleInput($event)"
    (focus)="handleFocus()"
    (blur)="handleBlur()"
    #input/>

@if(labelLeft()) {
    <label class="label-left" [for]="id" part="label-left">{{ labelLeft() }}</label>
}

<div class="toggle" (click)="toggle()"></div>

@if(labelRight()) {
    <label class="label-right" [for]="id" part="label-right">{{ labelRight() }}</label>
}
