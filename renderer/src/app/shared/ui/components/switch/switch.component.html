@if(label()) {
    <label [for]="id">{{ label() }}</label>
}

<input
    type="checkbox"
    [id]="id"
    [disabled]="disabled()"
    [checked]="value()"
    (change)="handleInput($event)"
    (focus)="handleFocus()"
    (blur)="handleBlur()"
    #input/>

<div class="switch" role="switch" [attr.aria-checked]="value()" (click)="toggle()"></div>
