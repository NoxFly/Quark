<div class="alert-backdrop"></div>

<div class="alert-content" role="alertdialog" aria-modal="true">
    <div class="alert-body">
        <div class="alert-badge" aria-hidden="true">{{ badge() }}</div>

        <div class="alert-text">
            @if(title()) {
                <h4 class="alert-title">{{ title() }}</h4>
            }

            @if(message()) {
                <div class="message" [innerHTML]="getPrettyMessage() | bypass: 'html'"></div>
            }

            @if(hasDetails()) {
                <div class="details">
                    <button type="button" class="btn-details" [class.opened]="detailsOpened()" (click)="toggleDetails()">
                        {{ i18n.t(detailsOpened() ? 'ui.alert.hideDetails' : 'ui.alert.showDetails') }}
                    </button>

                    @if(detailsOpened()) {
                        <div class="details-content" [innerHTML]="formattedDetails() | bypass: 'html'"></div>
                    }
                </div>
            }
        </div>
    </div>

    @if(hasActions()) {
        <div class="actions">
            @for(action of actions(); track $index) {
                <ui-button
                    type="button"
                    [class]="'btn-' + getButtonRoleClass(action)"
                    [color]="actionColor(action)"
                    [icon]="action.icon ?? null"
                    (click)="onActionClicked(action)">
                    {{ action.text }}
                </ui-button>
            }
        </div>
    }
</div>
