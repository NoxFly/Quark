<div class="toast-content">
    @if(busy()) {
        <span class="toast-spinner" aria-hidden="true"></span>
    }

    <span class="message">{{ message() }}</span>

    @if(hasActions()) {
        <div class="actions">
            @for(action of actions(); track $index) {
                <button type="button" class="toast-action" (click)="onActionClicked(action)">
                    {{ action.text }}
                </button>
            }
        </div>
    }

    @if(closable()) {
        <button type="button" class="close-button" [attr.aria-label]="i18n.t('ui.modal.close')" (click)="close()">✕</button>
    }
</div>

@if(hasDuration()) {
    <div class="toast-duration-bar"></div>
}
